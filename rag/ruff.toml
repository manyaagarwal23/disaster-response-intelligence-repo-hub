# Lint for real bugs only (fast feedback, no style bikeshedding):
#   E4/E7/E9 - import, statement and syntax errors
#   F        - pyflakes: undefined names, unused imports/variables
#   B        - bugbear: common bug patterns (mutable defaults, etc.)
target-version = "py311"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "B"]

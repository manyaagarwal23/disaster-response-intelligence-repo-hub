name: Continuous Integration

# Fast safety net for rushed, disaster-time contributions:
#   1. lint + unit tests        (~1 min, no ML libraries)   -> blocks bad changes quickly
#   2. AI safety net (PRs only)  -> AI review + auto-generated regression tests
#   3. docker build + integration tests (only if 1 passes) -> proves the real stack works
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rag

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: rag/requirements-dev.txt

    - name: Install lightweight dependencies
      run: pip install -r requirements-dev.txt

    - name: Lint (ruff - real bugs only)
      run: ruff check --output-format=github .

    # Pinned commit (~19 MB shallow) so the evaluation ground truth is
    # checked against exactly the code that gets indexed
    - name: Fetch pinned Ushahidi commit
      run: |
        COMMIT=$(python -c "import config; print(config.USHAHIDI_COMMIT)")
        git init -q ../ushahidi
        git -C ../ushahidi remote add origin https://github.com/ushahidi/platform.git
        git -C ../ushahidi fetch -q --depth 1 origin "$COMMIT"
        git -C ../ushahidi checkout -q FETCH_HEAD

    - name: Unit tests (hand-written + auto-generated regression tests)
      run: pytest -q

  # Sweep/CodiumAI-style safety net on pull requests. Needs the
  # GROQ_API_KEY repository secret; without it both steps just report
  # that they were skipped. Never fails the build (advisory).
  ai-safety-net:
    name: AI review & generated tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
    - name: Checkout repository (full history for the diff)
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: rag/requirements-dev.txt

    - name: Install dependencies
      run: pip install -r rag/requirements-dev.txt langchain-core==1.6.6 langchain-groq==1.1.3

    - name: AI review of the pull request diff
      run: python rag/tools/ai_review.py --base ${{ github.event.pull_request.base.sha }} --post

    - name: Auto-generate regression tests for changed modules
      working-directory: rag
      run: python tools/generate_tests.py --changed --base ${{ github.event.pull_request.base.sha }}

    - name: Apply Ruff auto-fixes locally
      run: ruff check --fix --exit-zero rag

    - name: Post Ruff fixes as one-click PR suggestions
      uses: reviewdog/action-suggester@v1
      with:
        tool_name: ruff-autofix

    - name: Upload generated tests and review
      uses: actions/upload-artifact@v4
      with:
        name: ai-safety-net
        path: |
          rag/tests/generated/
          reports/ai-review-*.md
          reports/generated-tests-*.md
        if-no-files-found: ignore

  docker:
    name: Docker build & integration tests
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        tags: disaster-response-rag:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Integration tests (real ChromaDB + embedding model)
      run: docker run --rm disaster-response-rag:ci pytest -m integration -q -p no:cacheprovider

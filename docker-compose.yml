# Usage:
#   echo "GROQ_API_KEY=gsk_..." > .env      (optional - without it you get search results only;
#                                         GROQ_API_KEYS=k1,k2,k3 for a key chain, OLLAMA_MODEL=llama3.2:3b for a local fallback)
#   docker compose up --build
#   open http://localhost:8000      (PORT=8001 docker compose up  to use another port)
services:
  rag:
    build: .
    image: disaster-response-rag
    ports:
      - "${PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # the host's Ollama (local fallback model)
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_KEYS: ${GROQ_API_KEYS:-}         # comma-separated, tried in order
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}           # e.g. llama3.2:3b, installed in Ollama on the host
      OLLAMA_HOST: http://host.docker.internal:11434
    volumes:
      - rag-data:/data
    restart: unless-stopped

volumes:
  rag-data:
